{% extends "base.html" %}
{% block title %}Error {{ code }} · NWR BI Portal{% endblock %}
{% block content %}
<div class="error-page">
  <div class="code">{{ code }}</div>
  <p>{{ message }}</p>
  {% if current_user.is_authenticated %}
    <a href="{{ url_for('dashboard.home') }}" class="btn">Back to Dashboard</a>
  {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn">Log In</a>
  {% endif %}
</div>
{% endblock %}
